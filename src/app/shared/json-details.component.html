<section class="details-card" aria-label="Response details">
  <header class="card-heading">
    <span class="heading-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
    </span>
    <div class="heading-copy"><span class="eyebrow">REPORT SUMMARY</span><h3>Response details</h3></div>
    <span class="field-count">{{ fields().length }} fields</span>
  </header>
  <dl class="details-list">
    @for (field of fields(); track field.key) {
      <div class="detail-row" [class.prominent]="field.prominent">
        <dt>{{ field.key }}</dt>
        <dd>{{ field.value }}</dd>
      </div>
    } @empty {
      <div class="empty">No details available.</div>
    }
  </dl>
</section>
