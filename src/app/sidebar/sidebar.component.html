<div class="sidebar-top">
  <a class="brand" href="./" (click)="$event.preventDefault(); newChat()" aria-label="Chat home"><span class="brand-mark"><app-icon name="spark" /></span><span>Chat</span></a>
  <button class="icon-button" (click)="close.emit()" aria-label="Close sidebar" title="Close sidebar"><app-icon name="panel" /></button>
</div>
<nav aria-label="Main navigation">
  <button class="nav-button" aria-label="New chat" (click)="newChat()"><app-icon name="edit" />New chat<span class="shortcut" aria-hidden="true">+</span></button>
  <button class="nav-button" (click)="searching.set(!searching()); search.set('')" [attr.aria-expanded]="searching()"><app-icon name="search" />Search chats</button>
</nav>
@if (searching()) {
  <div class="search-field"><app-icon name="search" /><input aria-label="Search conversations" placeholder="Search your chats…" [ngModel]="search()" (ngModelChange)="search.set($event)" /></div>
}
<div class="history-heading">Your chats</div>
<div class="history-list">
  @for (chat of filtered(); track chat.id) {
    <div class="history-row" [class.active]="store.activeId() === chat.id">
      <button class="history-title" (click)="select(chat.id)" [title]="chat.title" [attr.aria-current]="store.activeId() === chat.id ? 'page' : null">{{ chat.title }}</button>
      <button class="delete-chat icon-button" (click)="store.remove(chat.id)" [attr.aria-label]="'Delete chat: ' + chat.title" title="Delete chat"><app-icon name="trash" /></button>
    </div>
  } @empty {
    <p class="history-empty">{{ search() ? 'No matching conversations.' : 'A little space for your big ideas. Your conversations will appear here.' }}</p>
  }
</div>
<div class="sidebar-bottom">
  <button class="nav-button theme-button" (click)="toggleTheme.emit()"><app-icon [name]="dark() ? 'sun' : 'moon'" />{{ dark() ? 'Light appearance' : 'Dark appearance' }}</button>
  <div class="profile"><span class="avatar">Y</span><div><strong>Your workspace</strong><small>Personal · Saved chats</small></div><span class="online-dot" aria-label="Local mode"></span></div>
</div>
